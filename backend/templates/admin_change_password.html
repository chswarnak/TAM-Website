
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAM - Change Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .password-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: 380px;
            max-width: calc(100% - 40px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #273d6b;
            font-size: 25px;
            text-align: center;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            background: #273d6b;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        .error {
            color: #b42318;
            text-align: center;
        }
    </style>

<!-- TAM-ADMIN-PASSWORD-FESTIVAL-V1 -->
<link rel="stylesheet"
      href="/static/css/tam-exact-border.css?v=1">
<link rel="stylesheet"
      href="/static/css/tam-admin-festival.css?v=1">


<!-- TAM-GLOBAL-CLICKABLE-LOGO-V1 -->
<link rel="stylesheet" href="/static/css/tam-site-logo.css">

</head>

<body>



<!-- TAM-BIG-BACKGROUND-WATERMARK-V1 -->
<div class="tam-background-watermark tam-watermark-left"
     aria-hidden="true"></div>
<div class="tam-background-watermark tam-watermark-right"
     aria-hidden="true"></div>


<!-- TAM-GLOBAL-CLICKABLE-LOGO-V1 -->
<a
    class="tam-site-logo"
    href="/events/tam-diwali-2026"
    aria-label="TAM Event Home"
    title="Return to TAM Event Home"
>
    <img
        src="/static/icons/tam-icon-512.png"
        alt="Telugu Association of Montreal"
        width="70"
        height="70"
    >
</a>

    <div class="password-box tam-exact-border tam-admin-festival">
        <h1>Set Your New Password</h1>

        <p>
            For security, TAM requires new organizers
            to change their temporary password.
        </p>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form action="/admin/change-password" method="post">

            <label for="current_password">
                Temporary Password
            </label>
            <input type="password"
                   id="current_password"
                   name="current_password"
                   autocomplete="current-password"
                   required>


            <p style="font-size:13px; text-align:left;">
                Your new password must contain 8-128 characters,
                including at least one uppercase letter,
                one lowercase letter, one number and
                one special character.
            </p>

            <label for="new_password">
                New Password
            </label>
            <input type="password"
                   id="new_password"
                   name="new_password"
                   minlength="8" maxlength="128"
                   autocomplete="new-password"
                   required>

            <label for="confirm_password">
                Confirm New Password
            </label>
            <input type="password"
                   id="confirm_password"
                   name="confirm_password"
                   minlength="8" maxlength="128"
                   autocomplete="new-password"
                   required>

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token }}">

            <button type="submit">
                Change Password
            </button>
        </form>
    </div>
    <script defer src="/static/tam-password-visibility.js?v=1098"></script>
</body>
</html>
