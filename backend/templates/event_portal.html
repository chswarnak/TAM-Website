
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>TAM Event Photo Portal</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f6fb;
            font-family: Arial, sans-serif;
            color: #17233c;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .portal {
            background: white;
            width: 100%;
            max-width: 460px;
            padding: 30px 22px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,.09);
            text-align: center;
        }

        h1 { margin: 0 0 10px; font-size: 26px; }
        .subtitle { color: #64748b; margin-bottom: 28px; }

        .option {
            display: block;
            padding: 22px;
            margin-bottom: 14px;
            border: 1px solid #dbe2ef;
            border-radius: 12px;
            color: #17233c;
            text-decoration: none;
            text-align: left;
        }

        .option strong {
            display: block;
            font-size: 18px;
            margin-bottom: 7px;
        }

        .option span { color: #64748b; font-size: 14px; }

        .option:hover {
            border-color: #2563eb;
            background: #f8fbff;
        }

        .disabled {
            background: #f8fafc;
            opacity: .65;
            cursor: default;
        }

        .footer {
            margin-top: 20px;
            color: #64748b;
            font-size: 12px;
        }
    
</style>

<!-- TAM-THEME-BEGIN -->
<style>
/* TAM Diwali 2026 — appearance only; no camera or upload changes */
:root{--gold:#f3c76c;--plum:#351847;--ink:#242033}
body{background:radial-gradient(circle at 13% 17%,#715078 0%,transparent 34%),radial-gradient(circle at 84% 77%,#793953 0%,transparent 36%),linear-gradient(140deg,#281439,#4b235b 60%,#261535)!important;color:var(--ink);min-height:100vh}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle,#ffdb99 1px,transparent 1.8px) 0 0/42px 42px;opacity:.15;pointer-events:none;z-index:0}
body>*{position:relative}
.container,.card,.dashboard,.form-container{border:1px solid rgba(232,178,93,.65)!important;border-radius:18px!important;box-shadow:0 14px 42px rgba(24,9,34,.3)!important;background-color:#fffaf5}
h1,h2{color:#713f67;letter-spacing:.01em}
button,.option,a.option,input[type=submit]{transition:filter .15s ease,transform .15s ease}
button:hover:not(:disabled),.option:hover,a.option:hover,input[type=submit]:hover{filter:brightness(1.08);transform:translateY(-1px)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #bd802d!important;outline-offset:3px}
img,video{max-width:100%}
@media(max-width:640px){body{padding:12px!important}.container,.card,.dashboard,.form-container{box-sizing:border-box;max-width:100%}}
@media(prefers-reduced-motion:reduce){button,.option,a.option,input[type=submit]{transition:none!important;transform:none!important}}

</style>
<!-- TAM-THEME-END -->
<style>

/* TAM-SPARKLE-EFFECT-V1 */
[data-tam-sparkle] {
 position:relative!important; isolation:isolate; overflow:hidden;
 border:1px solid var(--tam-color)!important;
 background:linear-gradient(115deg,var(--tam-light),#fff9f2 55%,var(--tam-light))!important;
 box-shadow:0 3px 12px var(--tam-shadow)!important;
 transition:box-shadow .2s ease,transform .2s ease!important;
}
[data-tam-sparkle]::after {
 content:'✦ · ✧ · ✦'; position:absolute; right:9px; top:8px;
 font-size:14px; letter-spacing:2px; color:var(--tam-color); opacity:.7;
 pointer-events:none; animation:tam-twinkle 1.8s ease-in-out infinite alternate;
}
[data-tam-sparkle]:not([aria-disabled='true']):hover,
[data-tam-sparkle]:not([aria-disabled='true']):focus-visible {
 transform:translateY(-2px)!important;
 box-shadow:0 7px 22px var(--tam-shadow),0 0 18px var(--tam-shadow)!important;
}
[data-tam-sparkle='agenda'] { --tam-color:#bc7c20; --tam-light:#fff0cf; --tam-shadow:#d5a25255; }
[data-tam-sparkle='contribute'] { --tam-color:#cb4174; --tam-light:#ffe6f0; --tam-shadow:#da669455; }
[data-tam-sparkle='find'] { --tam-color:#8054d3; --tam-light:#eee4ff; --tam-shadow:#9168d055; }
[data-tam-sparkle][aria-disabled='true'] {cursor:default;}
.tam-firework-particle {
 position:absolute;z-index:5;left:50%;top:50%;width:6px;height:6px;
 background:var(--spark-color);border-radius:50%;pointer-events:none;
 box-shadow:0 0 6px var(--spark-color),0 0 13px var(--spark-color);
 animation:tam-burst .45s ease-out forwards;
}
@keyframes tam-twinkle {from{opacity:.28;transform:scale(.9)}to{opacity:.9;transform:scale(1.07)}}
@keyframes tam-burst {to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
@media (prefers-reduced-motion:reduce) {
 [data-tam-sparkle],[data-tam-sparkle]::after{animation:none!important;transition:none!important;}
 .tam-firework-particle{display:none!important;}
}

</style>

/* Keep decorations beneath normal page controls and preserve camera preview. */
body::before {display:none !important;}
body > * {position:relative;z-index:1;}
.container,.card,main,.dashboard,.form-container {
 background:linear-gradient(150deg,rgba(255,246,228,.98),rgba(255,238,216,.985)) !important;
 border:2px solid rgba(231,166,54,.88) !important;
 border-radius:22px !important;
 box-shadow:0 18px 55px rgba(23,5,30,.43),0 0 23px rgba(244,157,51,.25),inset 0 0 0 3px rgba(255,255,255,.43) !important;
}
h1,h2,h3 {color:#673258 !important;}
/* Gold inner outlines, sparkle-gradient only on navigation cards, not photo thumbnails. */
.option,a.option {
 background:linear-gradient(110deg,rgba(255,252,246,.99),rgba(255,222,183,.98),rgba(255,246,228,.99)) !important;
 background-size:220% 100% !important;
 border:1.5px solid #e7ad5f !important;
 color:#32183f !important;
 box-shadow:0 3px 13px rgba(149,75,53,.15),inset 0 1px 0 rgba(255,255,255,.9) !important;
}
a.option:hover,a.option:focus-visible {
 background-position:100% 0 !important;
 box-shadow:0 0 17px rgba(255,171,39,.56),0 5px 22px rgba(104,41,94,.18) !important;
}
/* Keep inactive agenda visually distinct and inert as provided by template. */
.option[aria-disabled="true"],.option.disabled {opacity:.7;}
button:focus-visible,a:focus-visible,input:focus-visible {
 outline:3px solid #dd8c28 !important;outline-offset:3px;
}

    <main class="portal">
        <h1>Welcome to TAM Diwali 2026</h1>
        <p class="subtitle">
            Your event memories in one place
        </p>

        <div class="option disabled" aria-disabled="true">
            <strong>📅 Event Agenda</strong>
            <span>Coming soon</span>
        </div>

        <a class="option" href="/contributor/login">
            <strong>📸 Contribute Photos</strong>
            <span>
                Sign in using the contributor credentials provided by the TAM administrator.
            </span>
        </a>

        <a class="option" href="/find-my-photos">
            <strong>🔎 Find My Photos</strong>
            <span>
                Find your event photos without contributor registration.
            </span>
        </a>

        <p class="footer">
            TAM Smart Event Photo Sharing System
        </p>
    </main>
<script>

// TAM-SPARKLE-EFFECT-V1 — visual-only click enhancement.
(()=>{
  const choices = [
    {selector:'a[href="/contributor/login"]', kind:'contribute'},
    {selector:'a[href="/find-my-photos"]', kind:'find'}
  ];
  choices.forEach(({selector,kind})=>{
    const element=document.querySelector(selector);
    if(element) element.setAttribute('data-tam-sparkle',kind);
  });
  const agenda=[...document.querySelectorAll('.option, a, button, div')].find(element=>
    element.textContent?.includes('Event Agenda') &&
    element.textContent?.includes('Coming soon') &&
    element.textContent.length<180 && element.children.length<5
  );
  if(agenda && !agenda.hasAttribute('data-tam-sparkle')) {
    agenda.setAttribute('data-tam-sparkle','agenda');
    agenda.setAttribute('aria-disabled','true');
  }
  function burst(element){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for(let index=0; index<16;index++){
      const particle=document.createElement('span');
      const angle=2*Math.PI*index/16, distance=35+Math.random()*72;
      particle.className='tam-firework-particle';
      particle.style.setProperty('--dx',Math.cos(angle)*distance+'px');
      particle.style.setProperty('--dy',Math.sin(angle)*distance+'px');
      particle.style.setProperty('--spark-color',index%2?'#ffd65e':'#ff719b');
      particle.addEventListener('animationend',()=>particle.remove(),{once:true});
      element.appendChild(particle);
      setTimeout(()=>particle.remove(),650);
    }
  }
  let audioContext;
  function firecrackerSound(){
    try {
      const Context=window.AudioContext||window.webkitAudioContext;
      if(!Context) return;
      audioContext ??= new Context();
      if(audioContext.state==='suspended') audioContext.resume();
      const rate=audioContext.sampleRate;
      const buffer=audioContext.createBuffer(1,Math.ceil(rate*.16),rate);
      const samples=buffer.getChannelData(0);
      for(let i=0;i<samples.length;i++) samples[i]=(Math.random()*2-1)*Math.exp(-i/rate*33);
      const source=audioContext.createBufferSource(); source.buffer=buffer;
      const filter=audioContext.createBiquadFilter();filter.type='highpass';filter.frequency.value=800;
      const gain=audioContext.createGain();gain.gain.value=.12;
      source.connect(filter);filter.connect(gain);gain.connect(audioContext.destination);
      source.start(); source.stop(audioContext.currentTime+.17);
    }catch(error){ /* Browser sound restrictions must not interfere with links. */ }
  }
  document.querySelectorAll('a[data-tam-sparkle]').forEach(element=>{
    element.addEventListener('click',event=>{
      if(event.defaultPrevented || event.button!==0 || event.ctrlKey ||
         event.metaKey || event.altKey || event.shiftKey) return;
      burst(element);firecrackerSound();
      if(element.target && element.target!=='_self') return;
      event.preventDefault();
      const destination=element.href;
      setTimeout(()=>window.location.assign(destination),300);
    });
  });
})();

</script>
