<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAM | Temporary Password</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff7e6; color: #35143e;
               display: flex; justify-content: center; padding: 24px; margin: 0; }
        .card { max-width: 480px; width: 100%; background: white; padding: 28px;
                border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
        code { display: block; font-size: 22px; padding: 14px; margin: 14px 0;
               background: #f3e5f5; border-radius: 8px; text-align: center;
               overflow-wrap: anywhere; }
        a { color: #702080; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Temporary password issued</h1>
        <p>Give this password to the {{ kind }} (account #{{ account_id }}) privately.
           It is shown only once. They must choose a new password when they next log in.</p>
        <code id="temporary-password">{{ temporary }}</code>
        <p><a href="{{ back }}">Back</a></p>
    </main>
</body>
</html>
